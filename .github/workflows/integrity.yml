name: Website integrity
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integrity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node.js 24
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; Node.js 24
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: python3 -m unittest discover -s scripts/recovery -p 'test_*.py' -v
      - run: python3 -m unittest discover -s scripts/integrity -p 'test_*.py' -v
      - run: npm audit --audit-level=high
      - run: npm audit --omit=dev --audit-level=high
      # Waterbear also retains a pnpm lockfile; audit both dependency graphs.
      - run: npm exec --yes --package=pnpm@11.14.0 -- pnpm audit --audit-level=high
      - run: npm run build:preview:worker
      # No deploy credentials or automatic promotion. Candidate/stable live gates
      # are run explicitly using scripts/integrity/check_release.py.
