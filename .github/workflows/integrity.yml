name: Website integrity
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integrity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: python3 -m unittest discover -s scripts/recovery -p 'test_*.py' -v
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build:preview:worker
      # No deploy credentials or automatic promotion. Candidate/stable live gates
      # are run explicitly using scripts/integrity/check_release.py.
